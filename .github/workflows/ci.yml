name: CI

on:
  push:
    branches:
      - submission
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Terraform tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lambda/requirements-dev.txt

      - name: Install Lambda test dependencies
        run: python -m pip install --disable-pip-version-check -r lambda/requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q lambda scripts tests

      - name: Run Lambda unit tests
        run: python -m unittest discover -s lambda/tests -p 'test_*.py' -v

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build deterministic Lambda package
        run: python scripts/package_lambda.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize application Terraform without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Verify application provider lock file
        run: git diff --exit-code -- terraform/.terraform.lock.hcl

      - name: Validate application Terraform
        run: terraform -chdir=terraform validate

      - name: Run Terraform native tests
        run: terraform -chdir=terraform test -no-color

      - name: Initialize bootstrap Terraform
        run: terraform -chdir=bootstrap init -backend=false

      - name: Verify bootstrap provider lock file
        run: git diff --exit-code -- bootstrap/.terraform.lock.hcl

      - name: Validate bootstrap Terraform
        run: terraform -chdir=bootstrap validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint
        run: |
          tflint --chdir=terraform --init
          tflint --chdir=bootstrap --init

      - name: Run TFLint
        run: |
          tflint --chdir=terraform --recursive
          tflint --chdir=bootstrap

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lambda/requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --disable-pip-version-check \
            bandit==1.9.4 \
            checkov==3.3.15 \
            pip-audit==2.10.1

      - name: Audit IAM wildcard exceptions
        run: python scripts/check_iam_wildcards.py

      - name: Bandit Python SAST
        run: bandit -r lambda scripts -x lambda/tests -ll -ii

      - name: Audit Lambda development dependencies
        run: pip-audit -r lambda/requirements-dev.txt

      - name: Checkov application IaC
        run: checkov -d terraform --framework terraform --quiet --compact

      - name: Checkov bootstrap IaC
        run: checkov -d bootstrap --framework terraform --quiet --compact

      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          cache: "true"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table
          cache: "true"

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          persona: auditor
          min-severity: low
          min-confidence: medium
