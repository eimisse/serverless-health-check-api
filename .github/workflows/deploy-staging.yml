name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}

jobs:
  deploy:
    # workflow_dispatch can target another ref; only reviewed main may obtain AWS credentials.
    if: github.ref == 'refs/heads/main'
    name: Validate, deploy and verify staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write # GitHub OIDC mints the short-lived token exchanged with AWS STS.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required GitHub Environment variables
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET TF_STATE_KMS_KEY_ARN; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging GitHub Environment variable is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lambda/requirements-dev.txt

      - name: Install test and security tooling
        run: |
          python -m pip install --disable-pip-version-check -r lambda/requirements-dev.txt
          python -m pip install --disable-pip-version-check \
            bandit==1.9.4 \
            checkov==3.3.15 \
            pip-audit==2.10.1

      - name: Compile and unit test
        run: |
          python -m compileall -q lambda scripts tests
          python -m unittest discover -s lambda/tests -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build deterministic Lambda release
        run: |
          python scripts/package_lambda.py
          sha256sum build/lambda.zip | tee build/lambda.zip.sha256

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Validate Terraform before AWS access
        run: |
          terraform fmt -check -diff -recursive
          terraform -chdir=terraform init -backend=false
          git diff --exit-code -- terraform/.terraform.lock.hcl
          terraform -chdir=terraform validate
          terraform -chdir=terraform test -no-color

      - name: Audit IAM wildcard exceptions
        run: python scripts/check_iam_wildcards.py

      - name: Run Python security and dependency scans
        run: |
          bandit -r lambda scripts -x lambda/tests -ll -ii
          pip-audit -r lambda/requirements.txt
          pip-audit -r lambda/requirements-dev.txt

      - name: Checkov application IaC gate
        run: checkov -d terraform --framework terraform --quiet --compact

      - name: Trivy application IaC gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          cache: "true"

      - name: Trivy repository secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table
          cache: "true"

      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: health-check-staging-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify assumed AWS account
        shell: bash
        run: |
          set -euo pipefail
          expected_account="$(printf '%s' "${AWS_DEPLOY_ROLE_ARN}" | cut -d: -f5)"
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [ -z "${expected_account}" ] || [ "${actual_account}" != "${expected_account}" ]; then
            echo "Assumed AWS account does not match the configured deployment role." >&2
            exit 1
          fi
          echo "AWS caller identity verified against the staging deployment role."

      - name: Initialize encrypted staging remote state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/staging.backend.hcl <<EOF
          bucket       = "${TF_STATE_BUCKET}"
          key          = "env/staging/terraform.tfstate"
          region       = "${AWS_REGION}"
          encrypt      = true
          kms_key_id   = "${TF_STATE_KMS_KEY_ARN}"
          use_lockfile = true
          EOF
          terraform -chdir=terraform init -reconfigure -backend-config=/tmp/staging.backend.hcl

      - name: Create saved staging plan
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -var-file=environments/staging.tfvars \
            -var="application_version=${GITHUB_SHA}" \
            -out=tfplan
          terraform -chdir=terraform show -json tfplan > terraform/tfplan.json

      - name: Guard saved Terraform plan
        run: python scripts/check_terraform_plan.py terraform/tfplan.json --environment staging

      - name: Apply exact reviewed staging plan
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Export non-secret Terraform outputs and mask API key
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(terraform -chdir=terraform output -raw api_url)"
          api_key_id="$(terraform -chdir=terraform output -raw api_key_id)"
          lambda_name="$(terraform -chdir=terraform output -raw lambda_function_name)"
          table_name="$(terraform -chdir=terraform output -raw dynamodb_table_name)"
          table_arn="$(terraform -chdir=terraform output -raw dynamodb_table_arn)"
          kms_key_arn="$(terraform -chdir=terraform output -raw kms_key_arn)"
          vpc_id="$(terraform -chdir=terraform output -raw vpc_id)"
          subnet_ids="$(terraform -chdir=terraform output -json private_subnet_ids | jq -r 'join(",")')"
          endpoint_id="$(terraform -chdir=terraform output -raw dynamodb_vpc_endpoint_id)"
          api_key="$(aws apigateway get-api-key --api-key "${api_key_id}" --include-value --query value --output text)"

          if [ -z "${api_key}" ] || [ "${api_key}" = "None" ]; then
            echo "API Gateway did not return the generated API key value." >&2
            exit 1
          fi
          echo "::add-mask::${api_key}"

          {
            echo "ENVIRONMENT=staging"
            echo "API_URL=${api_url}"
            echo "API_KEY=${api_key}"
            echo "LAMBDA_FUNCTION_NAME=${lambda_name}"
            echo "DYNAMODB_TABLE_NAME=${table_name}"
            echo "DYNAMODB_TABLE_ARN=${table_arn}"
            echo "KMS_KEY_ARN=${kms_key_arn}"
            echo "VPC_ID=${vpc_id}"
            echo "PRIVATE_SUBNET_IDS=${subnet_ids}"
            echo "DYNAMODB_VPC_ENDPOINT_ID=${endpoint_id}"
            echo "APPLICATION_VERSION=${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Verify live staging functionality and security controls
        run: python scripts/verify_deployment.py

      - name: Prove Content-Type cannot bypass API Gateway validation
        run: python scripts/verify_gateway_boundary.py

      - name: Verify zero Terraform drift after deployment
        shell: bash
        run: |
          set +e
          terraform -chdir=terraform plan \
            -input=false \
            -detailed-exitcode \
            -var-file=environments/staging.tfvars \
            -var="application_version=${GITHUB_SHA}" \
            -out=post-deploy.tfplan
          exit_code=$?
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Post-deployment Terraform drift check passed."
            exit 0
          fi
          if [ "${exit_code}" -eq 2 ]; then
            echo "Post-deployment Terraform drift detected." >&2
            terraform -chdir=terraform show -no-color post-deploy.tfplan >&2
          fi
          exit "${exit_code}"
