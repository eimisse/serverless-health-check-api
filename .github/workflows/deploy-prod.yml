name: Deploy production

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  quality-gate:
    if: github.ref == 'refs/heads/main'
    name: Credential-free quality and security gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # Required only so the reusable quality workflow can inspect repository source.

  deploy:
    # workflow_dispatch can target another ref; only reviewed main may obtain AWS credentials.
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    name: Approve, deploy and verify prod
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Configure the GitHub `prod` Environment with required reviewers. This job
    # cannot receive environment variables or mint its OIDC token until approval.
    environment: prod
    permissions:
      contents: read # Required for checkout of the exact reviewed commit.
      id-token: write # Required only to exchange GitHub OIDC for short-lived AWS STS credentials.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required GitHub Environment variables
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET TF_STATE_KMS_KEY_ARN; do
            if [ -z "${!name:-}" ]; then
              echo "Required prod GitHub Environment variable is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build deterministic Lambda release
        run: |
          python scripts/package_lambda.py
          sha256sum build/lambda.zip | tee build/lambda.zip.sha256

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: health-check-prod-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify assumed AWS account
        shell: bash
        run: |
          set -euo pipefail
          expected_account="$(printf '%s' "${AWS_DEPLOY_ROLE_ARN}" | cut -d: -f5)"
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [ -z "${expected_account}" ] || [ "${actual_account}" != "${expected_account}" ]; then
            echo "Assumed AWS account does not match the configured prod deployment role." >&2
            exit 1
          fi
          echo "AWS caller identity verified against the prod deployment role."

      - name: Preflight live deployment-role read capabilities
        shell: bash
        run: |
          set -euo pipefail
          expected_account="$(printf '%s' "${AWS_DEPLOY_ROLE_ARN}" | cut -d: -f5)"
          python scripts/preflight_deployment_role.py \
            --environment prod \
            --region "${AWS_REGION}" \
            --expected-account "${expected_account}"

      - name: Initialize encrypted prod remote state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prod.backend.hcl <<EOF
          bucket       = "${TF_STATE_BUCKET}"
          key          = "env/prod/terraform.tfstate"
          region       = "${AWS_REGION}"
          encrypt      = true
          kms_key_id   = "${TF_STATE_KMS_KEY_ARN}"
          use_lockfile = true
          EOF
          terraform -chdir=terraform init -reconfigure -backend-config=/tmp/prod.backend.hcl

      - name: Create saved prod plan
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -var-file=environments/prod.tfvars \
            -var="application_version=${GITHUB_SHA}" \
            -out=tfplan
          terraform -chdir=terraform show -json tfplan > terraform/tfplan.json

      - name: Guard saved Terraform plan
        run: python scripts/check_terraform_plan.py terraform/tfplan.json --environment prod

      - name: Apply exact approved prod plan
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Export non-secret Terraform outputs and mask API key
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(terraform -chdir=terraform output -raw api_url)"
          api_key_id="$(terraform -chdir=terraform output -raw api_key_id)"
          lambda_name="$(terraform -chdir=terraform output -raw lambda_function_name)"
          table_name="$(terraform -chdir=terraform output -raw dynamodb_table_name)"
          table_arn="$(terraform -chdir=terraform output -raw dynamodb_table_arn)"
          kms_key_arn="$(terraform -chdir=terraform output -raw kms_key_arn)"
          vpc_id="$(terraform -chdir=terraform output -raw vpc_id)"
          subnet_ids="$(terraform -chdir=terraform output -json private_subnet_ids | jq -r 'join(",")')"
          endpoint_id="$(terraform -chdir=terraform output -raw dynamodb_vpc_endpoint_id)"
          api_key="$(aws apigateway get-api-key --api-key "${api_key_id}" --include-value --query value --output text)"

          if [ -z "${api_key}" ] || [ "${api_key}" = "None" ]; then
            echo "API Gateway did not return the generated prod API key value." >&2
            exit 1
          fi
          echo "::add-mask::${api_key}"

          {
            echo "ENVIRONMENT=prod"
            echo "API_URL=${api_url}"
            echo "API_KEY=${api_key}"
            echo "LAMBDA_FUNCTION_NAME=${lambda_name}"
            echo "DYNAMODB_TABLE_NAME=${table_name}"
            echo "DYNAMODB_TABLE_ARN=${table_arn}"
            echo "KMS_KEY_ARN=${kms_key_arn}"
            echo "VPC_ID=${vpc_id}"
            echo "PRIVATE_SUBNET_IDS=${subnet_ids}"
            echo "DYNAMODB_VPC_ENDPOINT_ID=${endpoint_id}"
            echo "APPLICATION_VERSION=${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Verify live prod functionality and security controls
        run: python scripts/verify_prod_deployment.py

      - name: Verify immutable Lambda release alias
        run: python scripts/verify_release_alias.py

      - name: Prove invalid requests cannot bypass API Gateway validation
        run: python scripts/verify_gateway_boundary.py

      - name: Verify zero Terraform drift after deployment
        shell: bash
        run: |
          set +e
          terraform -chdir=terraform plan \
            -input=false \
            -detailed-exitcode \
            -var-file=environments/prod.tfvars \
            -var="application_version=${GITHUB_SHA}" \
            -out=post-deploy.tfplan
          exit_code=$?
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Post-deployment prod Terraform drift check passed."
            exit 0
          fi
          if [ "${exit_code}" -eq 2 ]; then
            echo "Post-deployment prod Terraform drift detected." >&2
            terraform -chdir=terraform show -no-color post-deploy.tfplan >&2
          fi
          exit "${exit_code}"
